name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds the default target `Forcing` (strict — `warningAsError` is on),
      # fetching the mathlib cache first.
      - uses: leanprover/lean-action@v1
